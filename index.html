<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#037951" />
    <!-- Before the stylesheets, so a slow font request can't delay it. Keep in step with ThemeToggle. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('bettercarmona-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1a16');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/bettercarmona-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Figtree speaks (display), Inter works (body), JetBrains Mono labels. -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="preconnect" href="%PORTAL_API%" crossorigin>
    <title>%PORTAL_TITLE%</title>
    <meta name="description" content="%PORTAL_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PORTAL_NAME%" />
    <meta property="og:title" content="%PORTAL_TITLE%" />
    <meta property="og:description" content="%PORTAL_DESCRIPTION%" />
    %PORTAL_URL_META%
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portal needs JavaScript. Every project is also on https://budget.bettergov.ph/hgab/2027/overview.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
